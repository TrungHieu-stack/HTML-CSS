<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Màu trong suốt</title>
    <style>
        body {
            background-color:rgb(17, 12, 12);
        }
        .do {
            color: rgba(255, 0, 0, 1); /* đỏ đậm */
        }
        .do-mo {
            color: rgba(255, 0, 0, 0.5); /* đỏ mờ 50% */
        }
        .do-trong {
            color: rgba(255, 0, 0, 0.2); /* đỏ rất trong suốt */
        }
    </style>
</head>
<body>
    <h1 class="do">Chữ đỏ đậm</h1>
    <h1 class="do-mo">Chữ đỏ mờ</h1>
    <h1 class="do-trong">Chữ đỏ trong suốt</h1>
</body>
</html>
